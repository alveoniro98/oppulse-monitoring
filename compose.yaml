services:
  opspulse:
    build: .
    container_name: opspulse
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      APP_VERSION: "1.0.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
